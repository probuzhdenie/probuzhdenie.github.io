name: Check Telegram for a newspaper issue

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: telegram-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.result.outputs.status }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Poll Telegram
        id: result
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_EDITOR_CODE: ${{ secrets.TELEGRAM_EDITOR_CODE }}
          TELEGRAM_ALLOWED_CHAT_IDS: ${{ vars.TELEGRAM_ALLOWED_CHAT_IDS }}
          PHOTO_WAIT_MS: "1800000"
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "status=idle" >> "$GITHUB_OUTPUT"
            echo "TELEGRAM_BOT_TOKEN is not configured."
            exit 0
          fi
          node bot/poll.js

      - name: Commit the issue
        if: steps.result.outputs.status != 'idle'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/state.json public/data
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update the newspaper issue from Telegram"
          git push

      - name: Install and build
        if: steps.result.outputs.status == 'published'
        run: |
          npm ci
          npm run build

      - name: Upload site
        if: steps.result.outputs.status == 'published'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: poll
    if: needs.poll.outputs.status == 'published'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
